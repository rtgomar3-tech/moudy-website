<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 الكلمة المفقودة | مودي العربي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="MOUDY.css">
</head>
<body class="SUB-PAGE MISSING-PAGE">
    <div class="site-nav" id="siteNav"></div>

    <main class="memory-wrap">
        <!-- شاشة البداية -->
        <section class="memory-screen" id="missStart">
            <h1 class="page-title">🔍 الكلمة المفقودة</h1>
            <p class="page-sub">كلمة ناقصة من بيت أغنية — اختار الصح من 4 خيارات.</p>

            <div class="level-grid">
                <button class="level-card" data-level="easy" type="button">
                    <span class="level-icon">🥉</span>
                    <span class="level-title">سهل</span>
                    <span class="level-meta">10 أسئلة — 20 ثانية</span>
                </button>
                <button class="level-card" data-level="medium" type="button">
                    <span class="level-icon">🥈</span>
                    <span class="level-title">متوسط</span>
                    <span class="level-meta">10 أسئلة — 15 ثانية</span>
                </button>
                <button class="level-card" data-level="hard" type="button">
                    <span class="level-icon">🥇</span>
                    <span class="level-title">صعب</span>
                    <span class="level-meta">10 أسئلة — 10 ثواني</span>
                </button>
            </div>
        </section>

        <!-- شاشة اللعب -->
        <section class="memory-screen" id="missPlay" hidden>
            <div class="memory-hud">
                <div class="hud-item">
                    <span class="hud-label">السؤال</span>
                    <span class="hud-value" id="missQNum">1 / 10</span>
                </div>
                <div class="hud-item">
                    <span class="hud-label">النقاط</span>
                    <span class="hud-value" id="missScore">0</span>
                </div>
                <div class="hud-item" id="missTimerBox">
                    <span class="hud-label">الوقت</span>
                    <span class="hud-value" id="missTimer">20</span>
                </div>
            </div>

            <div class="miss-song-badge" id="missSongBadge"></div>

            <div class="miss-line" id="missLine"></div>

            <div class="miss-answers" id="missAnswers"></div>

            <div class="emoji-feedback" id="missFeedback"></div>

            <button class="back-btn" id="missBack" type="button">← رجوع للمستويات</button>
        </section>

        <!-- شاشة النهاية -->
        <section class="memory-screen win-screen" id="missEnd" hidden>
            <div class="win-icon" id="missEndIcon">🏆</div>
            <h2 class="win-title" id="missEndTitle">مبروك!</h2>
            <p class="win-stats" id="missEndStats"></p>
            <div class="win-buttons">
                <button class="btn" id="missAgain" type="button">العب مرة تانية</button>
                <button class="back-btn" id="missEndBack" type="button">المستويات</button>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@twemoji/api@latest/dist/twemoji.min.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
